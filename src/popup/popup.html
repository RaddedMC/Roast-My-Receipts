<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Roastii</title>
    <link rel="stylesheet" href="../components/roast-modal.css">
  </head>
  <body>
    <main class="roastii-shell" style="padding: 10px; min-width: 360px;">
      <section class="roastii-card">
        <header class="roastii-header">
          <div class="roastii-pill">Roastii</div>
          <p class="roastii-subtitle">I'm the only one standing between you and a suspiciously justified purchase.</p>
        </header>
        <div class="roastii-section roastii-stack">
          <div class="roastii-grid two">
            <div class="roastii-panel roastii-stat">
              <span class="roastii-label">Saved From</span>
              <strong id="saved-count">0</strong>
            </div>
            <div class="roastii-panel roastii-stat">
              <span class="roastii-label">Money Saved</span>
              <strong id="money-saved">$0</strong>
            </div>
            <div class="roastii-panel roastii-stat">
              <span class="roastii-label">Avg Regret</span>
              <strong id="avg-regret">0/10</strong>
            </div>
            <div class="roastii-panel roastii-stat">
              <span class="roastii-label">Today</span>
              <strong id="roasted-today">0</strong>
            </div>
          </div>
          <div class="roastii-actions">
            <button class="roastii-button primary" id="roast-current">Roast This Product</button>
            <button class="roastii-button secondary" id="open-settings">Settings</button>
          </div>
          <div class="roastii-panel roastii-stack">
            <p class="roastii-label">Your roasts</p>
            <p class="roastii-inline-note" id="stream-state">Standing by</p>
            <pre class="roastii-copy" id="stream-preview" style="white-space: pre-wrap; margin: 0;">Start a roast to see roasts here.</pre>
          </div>
          <div class="roastii-panel roastii-stack">
            <p class="roastii-label">Recent Roasts</p>
            <div class="roastii-stack" id="recent-roasts"></div>
          </div>
          <p class="roastii-inline-note" id="popup-status"></p>
        </div>
      </section>
    </main>
    <script type="module" src="./popup.js"></script>
  </body>
</html>
