<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Meet Roastii</title>
    <link rel="stylesheet" href="../components/roast-modal.css">
  </head>
  <body>
    <main class="roastii-shell">
      <section class="roastii-card">
        <header class="roastii-header">
          <div class="roastii-pill">Onboarding</div>
          <h1 class="roastii-title">Roastii wants your shopping lore</h1>
          <p class="roastii-subtitle">Eight questions. Zero judgement spirals. Maximum useful side-eye.</p>
        </header>
        <div class="roastii-section roastii-stack">
          <div class="roastii-panel roastii-stack">
            <p class="roastii-label">Roastii Says</p>
            <p class="roastii-copy" id="intro-copy">I am your plush demon accountant. Let's figure out where your wallet keeps getting ambushed.</p>
          </div>
          <div class="roastii-panel roastii-stack">
            <div class="roastii-grid two">
              <div class="roastii-stat">
                <span class="roastii-label">Progress</span>
                <strong id="progress-count">0/8</strong>
              </div>
              <div class="roastii-stat">
                <span class="roastii-label">Internal Vibe Check</span>
                <p class="roastii-inline-note" id="internal-note">Roastii is listening for patterns.</p>
              </div>
            </div>
            <form id="question-form" class="roastii-form">
              <div class="roastii-stack">
                <p class="roastii-label">Question</p>
                <h2 class="roastii-title" id="question-title" style="font-size: 24px;"></h2>
              </div>
              <div class="roastii-choices" id="question-options"></div>
              <label class="roastii-stack roastii-hidden" id="custom-answer-wrap">
                <span class="roastii-label">Custom Answer</span>
                <textarea class="roastii-textarea" id="custom-answer" placeholder="Tell Roastii the truth."></textarea>
              </label>
              <label class="roastii-stack roastii-hidden" id="follow-up-wrap">
                <span class="roastii-label" id="follow-up-label">Follow-up</span>
                <input class="roastii-input" id="follow-up-input" type="text">
              </label>
              <div class="roastii-actions">
                <button class="roastii-button primary" type="submit">Lock In Answer</button>
              </div>
            </form>
          </div>
        </div>
      </section>
    </main>
    <script type="module" src="./onboarding.js"></script>
  </body>
</html>
