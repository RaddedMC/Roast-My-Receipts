<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Roastii Settings</title>
    <link rel="stylesheet" href="../components/roast-modal.css">
  </head>
  <body>
    <main class="roastii-shell">
      <section class="roastii-card">
        <header class="roastii-header">
          <div class="roastii-pill">Teach me how to judge your shopping.</div>
          <h1 class="roastii-title">Settings</h1>
          <p class="roastii-subtitle">Configure my AI endpoint, model, and how harshly I judge you.</p>
          <p class="roastii-label">I'm compatible with any API that follows the OpenAI API format.</p>
        </header>
        <div class="roastii-section roastii-stack">
          <form id="settings-form" class="roastii-form">
            <div class="roastii-grid two">
              <label class="roastii-stack">
                <span class="roastii-label">AI endpoint</span>
                <input class="roastii-input" id="api-endpoint" name="apiEndpoint" type="url">
              </label>
              <label class="roastii-stack">
                <span class="roastii-label">Model</span>
                <select class="roastii-select" id="model" name="model"></select>
              </label>
            </div>
            <label class="roastii-stack">
              <span class="roastii-label">API Key</span>
              <input class="roastii-input" id="api-key" name="apiKey" type="password" placeholder="Enter your API key">
            </label>
            <div class="roastii-grid two">
              <label class="roastii-choice">
                <input id="enabled" name="enabled" type="checkbox">
                <span>Enable Amazon.ca integration</span>
              </label>
              <label class="roastii-choice">
                <input id="auto-roast" name="autoRoastOnAddToCart" type="checkbox">
                <span>Auto-roast when "Add to Cart" is clicked</span>
              </label>
            </div>
            <div class="roastii-grid two">
              <div class="roastii-panel roastii-stack">
                <p class="roastii-label">Connection Check</p>
                <p class="roastii-inline-note" id="connection-status">Not tested yet.</p>
                <button class="roastii-button secondary" id="test-connection" type="button">Test Connection</button>
              </div>
            </div>
            <div class="roastii-actions">
              <button class="roastii-button primary" type="submit">Save Settings</button>
              <button class="roastii-button ghost" id="redo-onboarding" type="button">Redo Setup</button>
              <button class="roastii-button ghost" id="clear-data" type="button">Clear All Data</button>
            </div>
            <p class="roastii-inline-note" id="save-status"></p>
          </form>
        </div>
      </section>
    </main>
    <script type="module" src="./options.js"></script>
  </body>
</html>
